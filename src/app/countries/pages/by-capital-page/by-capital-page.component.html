<div class="flex flex-col gap-10">

<h2 class="text-3xl font-bold">Por Capital</h2>

<hr>


  <shared-search-box [placeholder]="'Buscar Por Capital'"
  [initialTerm] ="initialTerm"
  (searchValueOut)="searchByCapital($event)"></shared-search-box>

  <div class="flex flex-col gap-10">

    <shared-loading-spinner *ngIf="loading; else tabla" ></shared-loading-spinner>

    <ng-template #tabla>
      <country-table [countries]="countries" ></country-table>
    </ng-template>


  </div>

</div>
