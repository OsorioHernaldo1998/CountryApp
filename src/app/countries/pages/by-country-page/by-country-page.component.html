<div class="flex flex-col gap-10">

  <h2 class="text-3xl font-bold"> Por Ciudad </h2>

  <hr>

  <shared-search-box [placeholder]="'Buscar Por Ciudad'"
    [initialTerm]="initialTerm"
    (searchValueOut)="searchByCountry($event)" ></shared-search-box>

  <shared-loading-spinner *ngIf="loading ; else tabla"></shared-loading-spinner>

  <ng-template #tabla>

    <div>
      <country-table [countries]="countries"></country-table>
    </div>

  </ng-template>

</div>
